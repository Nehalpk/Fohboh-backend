version: "3.9"

networks:
  backend-network:
    external: true  # since you already have it created

services:
  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    networks:
      - backend-network
    ports:
      - "6379:6379"  # expose redis port for testing (optional)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    env_file:
      - .env
    networks:
      - backend-network
    ports:
      - "8000:8000"  # adjust according to your backend app port
    depends_on:
      - redis
